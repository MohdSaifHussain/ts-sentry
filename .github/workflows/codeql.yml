# SPDX-License-Identifier: MIT
#
# Advanced setup rather than GitHub's default setup, deliberately: a workflow
# file is version-controlled and reviewable in a pull request, where default
# setup is a repository setting whose configuration lives somewhere a reader of
# this repository cannot see. This project's whole posture is that a control
# nobody can inspect is a control nobody can audit.
#
# If default setup is ever enabled in Settings, GitHub will refuse to run this
# workflow, and this file should be deleted rather than left as a decoration.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published query finds this code without waiting for
    # someone to push.
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload the SARIF results
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: python
          # security-extended over the default suite. This repository is small
          # and the extra query time is worth more than the minutes it costs.
          queries: security-extended

      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:python"
