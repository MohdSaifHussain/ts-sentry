[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ts-sentry"
version = "1.0.0"
description = "Trust & Safety Sentry: a governed agentic workbench for scaled-abuse analysis"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Mohd Saif Hussain" }]

dependencies = [
    "duckdb>=1.5",
    # STEP-07 D2 renders the sensitivity figures, and STEP-07 D5's `report`
    # verb renders them at runtime rather than only in tests, which is why
    # this is a main dependency and not a dev extra. Deliberately no upper
    # pin: nothing in this project claims PNG bytes are stable across
    # matplotlib versions, so an upgrade is not expected to break anything.
    # See docs/DECISIONS.md for the byte-stable-data / hash-stable-in-env-PNG
    # split, and `measurement.plots` for how determinism is obtained.
    "matplotlib>=3.8",
    "numpy>=2.0",
    # Used only for the DuckDB bulk-load path (register + INSERT SELECT),
    # which is ~2 orders of magnitude faster than executemany for the
    # tens-of-thousands-of-rows tables this generator produces.
    "pandas>=2.0",
    # Pin is a real minimum-version requirement, not just reproducibility
    # hygiene: v2.1.0 is the first AnalystKit release with Parquet support,
    # which the D6 quality gate (profile/validate/reconcile against Parquet
    # exports) depends on. See docs/decisions/STEP-01-data-foundation.md
    # Outcome section for the accuracy-via-reconcile rationale.
    #
    # Pinned to the commit SHA rather than the tag `v2.1.0` (STEP-08, closing a
    # gap docs/DECISIONS.md has listed since it was written: "a tag can be
    # moved, a SHA cannot"). Verified with `git ls-remote` rather than assumed:
    # refs/tags/v2.1.0^{} dereferences to exactly ab98ee6a..., so this tightens
    # the pin without changing a byte of what gets installed. The tag also
    # currently equals the remote's main HEAD, which is precisely the situation
    # where a tag is cheapest to move.
    "analystkit @ git+https://github.com/MohdSaifHussain/analystkit@ab98ee6a3c309f57134d48787aa604b1d1044f62",
]

[project.optional-dependencies]
# The live model path only. Never installed in CI: STEP-03 3.4 makes the
# deterministic stub adapter the CI path, and the whole suite passes with this
# extra absent. Deliberately without a version floor - the offline environment
# cannot resolve or verify one, and asserting a number nobody checked is the
# guess CLAUDE.md's official-sources rule exists to prevent. The version
# actually exercised is recorded in the STEP-03 live-mode smoke note.
live = ["anthropic"]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "mypy>=1.13",
    "ruff>=0.8",
    "pytest-cov>=5.0",
    "pandas-stubs>=2.0",
]

[project.scripts]
ts-sentry = "ts_sentry.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ts_sentry"]

[tool.hatch.metadata]
# Required by hatchling to allow the analystkit git dependency above.
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/ts_sentry"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mypy]
strict = true
files = ["src", "tests"]

# The live adapter's only vendor import, and it is intentionally absent from
# the offline environment (see the `live` extra above). Typing it as Any here
# keeps `mypy --strict` meaningful for the other 99% of the codebase rather
# than failing on a dependency CI is designed not to have.
[[tool.mypy.overrides]]
module = ["anthropic.*", "anthropic"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
# Scope file discovery to the source and test trees regardless of how ruff
# is invoked (`ruff format .` vs `ruff format src tests`) or from where.
# Without this, `.` also picks up embedded Python code blocks in
# ARCHITECTURE.md - hand-aligned comments in a spec document, not code the
# formatter has any jurisdiction over.
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
